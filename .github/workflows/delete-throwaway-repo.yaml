name: Delete throwaway engagement repo
# One-shot helper for the IssueOps e2e. The workflow_dispatch caller token
# lacks delete_repo; the App that created the repo has administration: write.
# The name is allowlisted twice so a bad input cannot delete a customer repo.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Allowlisted throwaway repository name
        required: true
        type: string
jobs:
  delete:
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Refuse anything except the e2e throwaways
        env:
          NAME: ${{ github.event.inputs.name }}
        run: |
          set -euo pipefail
          case "$NAME" in
            ps-customer-issueops-e2e|ps-customer-generate-probe) ;;
            *)
              echo "::error::refusing to delete ${NAME}"
              exit 1
              ;;
          esac
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Delete repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NAME: ${{ github.event.inputs.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$NAME" in
            ps-customer-issueops-e2e|ps-customer-generate-probe) ;;
            *)
              echo "::error::refusing to delete ${NAME}"
              exit 1
              ;;
          esac
          gh api --method DELETE "repos/${OWNER}/${NAME}"
          echo "deleted ${OWNER}/${NAME}"
