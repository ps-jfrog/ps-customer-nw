name: Build JFrog PS Engagement Bundle
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
env:
  JF_URL: ${{ secrets.JF_URL || vars.JF_URL || format(secrets.JF_WORKSPACE_BASE_URL || vars.JF_WORKSPACE_BASE_URL || 'https://{0}.jfrog.io/', secrets.JF_NAME || vars.JF_NAME) }}
  JF_PROJECT: ${{ secrets.JF_PROJECT || vars.JF_PROJECT || '' }}
  JF_OIDC_AUDIENCE: ${{ secrets.JF_OIDC_AUDIENCE || vars.JF_OIDC_AUDIENCE || format('{0}/{1}', github.server_url, github.repository_owner) }}
  JF_OIDC_PROVIDER: ${{ secrets.JF_OIDC_PROVIDER || vars.JF_OIDC_PROVIDER || 'ghc-ps-jfrog' }}
  JFROG_CLI_VERSION: ${{ vars.JFROG_CLI_VERSION || 'latest' }}
  JFROG_CLI_LOG_TIMESTAMP: DATE_AND_TIME
  JFROG_CLI_LOG_LEVEL: ${{ vars.JFROG_CLI_LOG_LEVEL || 'INFO' }} # DEBUG, INFO, WARN, ERROR
  # The fallback must be exactly 32 bytes: `jf config add` encrypts the config
  # with it and aborts on any other length with "Wrong length for master key",
  # failing the very first Setup step. The previous literal was 31.
  JFROG_CLI_ENCRYPTION_KEY: ${{ secrets.JFROG_CLI_ENCRYPTION_KEY || 'ThisIsNotSecureSoSetTheValueNow0' }}
  # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#github-context
  JFROG_CLI_BUILD_NAME: "${{ github.repository }}"
  JFROG_CLI_REMOTE: ${{ secrets.JFROG_CLI_REMOTE || vars.JFROG_CLI_REMOTE || 'jfrog-cli-remote' }}
  JFROG_CLI_PLUGINS_SERVER: ${{ secrets.JFROG_CLI_PLUGINS_SERVER || vars.JFROG_CLI_PLUGINS_SERVER || 'setup-jfrog-cli-server' }} # TODO: detect
  JFROG_CLI_PLUGINS_REPO: ${{ secrets.JFROG_CLI_PLUGINS_REPO || vars.JFROG_CLI_PLUGINS_REPO || 'jfrog-cli-plugins' }}
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || vars.DOCKER_REGISTRY || 'releases-docker.jfrog.io/' }}
  BUNDLE_REPO: "${{ secrets.BUNDLE_REPO || vars.BUNDLE_REPO || (secrets.JF_PROJECT || vars.JF_PROJECT || '') && format('{0}-ps-bundles', secrets.JF_PROJECT || vars.JF_PROJECT || '') || '' }}"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read
jobs:
  prepare-execution-matrix:
    name: Release Tags Matrix
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Watch CalVer Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_WORKFLOW: calver.yaml
        run: |
          RUN_ID=$(gh run list --workflow "$WATCH_WORKFLOW" --repo="${{ github.repository }}" --commit ${{ github.sha }} --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$RUN_ID" --repo="${{ github.repository }}" --exit-status
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare Execution Matrix
        id: set-matrix
        shell: bash
        run: |
          echo "JFROG_CLI_BUILD_NAME=${JFROG_CLI_BUILD_NAME#*/}" | sed 's/jfrog-cli-plugin-//' | sed 's/${{ github.repository_owner }}\///' >> $GITHUB_OUTPUT
          export TAGS=$(git for-each-ref --format '%(refname:short)' refs/heads/ refs/tags/ | while read ref; do
            # CalVer writes *annotated* tags, so `git rev-parse <tag>` yields the
            # tag object's own sha and never equals GITHUB_SHA. Peel to the commit
            # or the matrix silently resolves empty and nothing is ever published.
            REF_SHA=$(git rev-parse "$ref^{commit}")
            # echo "Checking $ref $REF_SHA"

            if [ "$REF_SHA" = "$GITHUB_SHA" ] && perl -e 'exit (shift =~ /^(\d+)\.(\d+)\.(\d+)(?:-([\w\d_.\/-]+?))?(?:\.(\d+))*?$/ ? 0 : 1)' "$ref"; then
              echo "$ref" | tr '/' '-'
              # echo "MATCH: $ref"
            fi
          done | jq -R -s -c 'split("\n")[:-1]')
          echo "MATRIX=$TAGS" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.MATRIX }}
      name: ${{ steps.set-matrix.outputs.JFROG_CLI_BUILD_NAME }}
  execute-scripts:
    needs: prepare-execution-matrix
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare-execution-matrix.outputs.matrix) }}
    name: Release
    env:
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}-${{ matrix.version }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.version }}
      cancel-in-progress: true
    steps:
      # https://github.com/marketplace/actions/setup-jfrog-cli
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_PROJECT: 'ps-jf'
        with:
          version: ${{ env.JFROG_CLI_VERSION }}
          oidc-provider-name: ${{ env.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ env.JF_OIDC_AUDIENCE }}
          download-repository: ${{ env.JFROG_CLI_REMOTE }}
          custom-server-id: ${{ env.JFROG_CLI_PLUGINS_SERVER }}
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      # TODO: use exclusions from .zipignore
      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v4
      # Evaluating .envrc runs ps_bundle_resolve, which reads from
      # `<JF_PROJECT>-ps-bundles`; the first Setup step overrides JF_PROJECT to
      # `ps-jf` for build-info, so its token cannot see that repo. Give the
      # resolver its own server under a distinct id rather than reusing the
      # upload token: that one is deliberately short-lived and is minted just
      # before it is needed, so it must not be spent waiting on a download.
      - name: Setup Bundle Reader
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See "Create Scoped Token" below: JF_PROJECT must be empty for the
          # exchange to reach the per-repo bundle mapping at all.
          JF_PROJECT: ''
        with:
          version: ${{ env.JFROG_CLI_VERSION }}
          oidc-provider-name: ${{ env.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ env.JF_OIDC_AUDIENCE }}
          download-repository: ${{ env.JFROG_CLI_REMOTE }}
          custom-server-id: ${{ env.JFROG_CLI_PLUGINS_SERVER }}-bundle-reader
      - name: Base Version
        env:
          VERSION_ID: ${{ matrix.version }}
          JFROG_CLI_SERVER_ID: ${{ env.JFROG_CLI_PLUGINS_SERVER }}-bundle-reader
        # `direnv reload` only flags the next shell-hook tick to re-evaluate
        # — CI has no direnv hook, so the .envrc is never run and the bundle
        # zip is never (re)built. `direnv exec . <cmd>` actively evaluates
        # .envrc in this directory (running _build_zip and friends with all
        # side effects, including bin/output.zip), then runs the command.
        run: |
          direnv allow .
          direnv exec . true
          # direnv exits 0 even when .envrc returns non-zero, so a failed
          # resolve or archive would otherwise stay silent until the upload
          # step died with a confusing "command not found".
          test -s bin/output.zip
      # Stays immediately before the upload so its token is freshly minted when
      # the upload spends it. Being last does *not* make it the default server:
      # setup-jfrog-cli runs `jf config add --interactive=false`, which leaves
      # the first-configured server as the default, so every step that needs
      # this token has to name it via JFROG_CLI_SERVER_ID.
      - name: Create Scoped Token
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-jfrog-cli forwards JF_PROJECT as `project_key` on the OIDC
          # token exchange, and Artifactory filters candidate identity mappings
          # by that project_key *before* it orders them by priority. The
          # per-repo bundle mapping carries no project_key, so any non-empty
          # JF_PROJECT makes it ineligible and the exchange falls through to the
          # org-wide project Contributor mapping instead. Contributor has no
          # DELETE_OVERWRITE_REPOSITORY, so republishing a bundle over an
          # existing path fails with "needs DELETE permission", and its 60s TTL
          # (vs. the bundle mapping's 1800s) is what expired the build-info
          # publish mid-job. Measured on ps-jfrog/ps-customer-template:
          #   project_key=""         -> groups:"<repo bundle group>"   ttl 1800
          #   project_key="ps-jfrog" -> roles:ps-jfrog:"Contributor"   ttl 60
          JF_PROJECT: ''
        with:
          version: ${{ env.JFROG_CLI_VERSION }}
          oidc-provider-name: ${{ env.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ env.JF_OIDC_AUDIENCE }}
          download-repository: ${{ env.JFROG_CLI_REMOTE }}
          # Deliberately not derived from JF_PROJECT: the step-level override
          # above would otherwise rename this server out from under the upload.
          custom-server-id: ${{ env.JFROG_CLI_PLUGINS_SERVER }}-bundle-writer
      - name: Upload Artifact
        env:
          BUNDLE_BRANCH: v${{ matrix.version }}
          BUNDLE_NAME: ${{ needs.prepare-execution-matrix.outputs.name }}
          JFROG_CLI_SERVER_ID: ${{ env.JFROG_CLI_PLUGINS_SERVER }}-bundle-writer
          # Must match the Build Information step below: the CLI keys its local
          # build cache by project, so recording artifacts under one project and
          # publishing under another yields an empty build-info.
          JFROG_CLI_BUILD_PROJECT: ''
        run: |
          export PATH="$PWD/.envrc.d:$PATH"
          ps_bundle_upload

      - name: Build Information
        # Run even when the upload step failed so a build-info record (with
        # whatever artifacts did succeed) is still published. setup-jfrog-cli's
        # auto-publish only does `jf rt bp --dry-run` for the summary; this
        # step is the only thing that actually persists build-info.
        if: success() || failure()
        env:
          # Without this, `jf` falls back to the default server -- the one the
          # first Setup step configured, whose org-wide Contributor token lives
          # for 60s. By the time the job reaches build-info (a couple of minutes
          # in) that token is dead and `jf rt bp` 401s with "Token failed
          # verification: expired". The bundle-writer token lasts 1800s and its
          # group already carries the build-info permission.
          JFROG_CLI_SERVER_ID: ${{ env.JFROG_CLI_PLUGINS_SERVER }}-bundle-writer
          # The first Setup step exports JFROG_CLI_BUILD_PROJECT=ps-jf as a side
          # effect of needing a ps-jf token to resolve the CLI plugin repo, which
          # sends build-info to the project-owned `ps-jf-build-info`. A
          # group-scoped token cannot deploy into a project's build-info repo
          # even with an explicit permission target on it -- measured with a real
          # bundle-group token:
          #   JFROG_CLI_BUILD_PROJECT=ps-jf -> 403 "not permitted to deploy"
          #   JFROG_CLI_BUILD_PROJECT=      -> "Build info successfully deployed"
          # Clearing it publishes to the global artifactory-build-info repo,
          # which the bundle group's `build` permission already covers.
          JFROG_CLI_BUILD_PROJECT: ''
        run: |
          jf rt bc
          jf rt bce
          jf rt bag
          jf rt bp --detailed-summary=true
