name: Sync Template

on:
  schedule:
    - cron: '0 7 * * 1' # Weekly on Mondays at 07:00 UTC
  workflow_dispatch:
    inputs:
      template_ref:
        description: 'Template branch or tag to sync from'
        required: false
        default: 'main'
        type: string
  push:
    paths:
      - '.github/workflows/sync-template.yaml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  TEMPLATE_REPO: ${{ vars.TEMPLATE_REPO || 'ps-jfrog/ps-customer-template' }}
  TEMPLATE_REF: ${{ inputs.template_ref || 'main' }}
  PR_BRANCH: chore/sync-template
  BOT_NAME: 'github-actions[bot]'
  BOT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'

jobs:
  sync-template:
    name: Sync from template
    if: github.repository != (vars.TEMPLATE_REPO || 'ps-jfrog/ps-customer-template')
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate_token
        with:
          client-id: ${{ vars.APP_CLIENT_ID || vars.ORG_APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || secrets.ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"

      - name: Fetch template
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git remote add template \
            "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE_REPO}.git" 2>/dev/null || \
            git remote set-url template \
            "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE_REPO}.git"
          git fetch template "${TEMPLATE_REF}"

      - name: Check if already up to date
        id: diff
        run: |
          # Histories are unrelated (template repos have no common ancestor),
          # so merge-base will fail — fall back to tree comparison.
          if git merge-base --is-ancestor FETCH_HEAD HEAD 2>/dev/null; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Already up to date with template ${TEMPLATE_REPO}@${TEMPLATE_REF}"
          elif git diff --quiet FETCH_HEAD -- 2>/dev/null; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tree identical to template ${TEMPLATE_REPO}@${TEMPLATE_REF}"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect dependency model
        id: shape
        if: steps.diff.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          # A repository still carrying the scripts-general-util gitlink or its
          # .gitmodules entry predates the artifact dependency model. Merging
          # the template into it conflicts on every shared file and leaves the
          # repo on both models at once; it needs a migration, not a sync.
          # Recorded here so the guard below can say so.
          era=false
          if [ -n "$(git ls-files -s -- scripts-general-util | awk '$1 == "160000" {print $4}')" ]; then
            era=true
          elif [ -f .gitmodules ] && \
               git config -f .gitmodules --get submodule.scripts-general-util.path >/dev/null 2>&1; then
            era=true
          fi
          echo "submodule_era=${era}" >> "$GITHUB_OUTPUT"
          if [ "$era" = "true" ]; then
            echo "::warning::This repository still uses the scripts-general-util git submodule."
          fi

      - name: Merge template changes
        if: steps.diff.outputs.up_to_date != 'true'
        id: merge
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          MERGE_SHA=$(git rev-parse FETCH_HEAD)

          git checkout -B "${PR_BRANCH}" "origin/${DEFAULT_BRANCH}"

          # --allow-unrelated-histories is required because template repos
          # produce a fresh commit history with no common ancestor.
          # --no-commit keeps the merge staged but uncommitted so the guard
          # step below runs against the tree *before* it becomes a commit.
          if git merge FETCH_HEAD --no-commit --no-ff --allow-unrelated-histories; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            # ls-files --unmerged is the authoritative source: it covers
            # content conflicts (UU/AA/AU/UA) and deletion conflicts
            # (DD/UD/DU), unlike `git diff --diff-filter=U` which misses
            # paths absent from the working tree.
            UNMERGED=$(git ls-files --unmerged)
            SUBMODULE_CONFLICTS=$(echo "$UNMERGED" \
              | awk '$1 == "160000" {print $4}' | sort -u)
            CONTENT_CONFLICTS=$(echo "$UNMERGED" \
              | awk '$1 != "160000" {print $4}' | sort -u)

            # Auto-resolve gitlink (submodule) conflicts before `git add -A`:
            # the runner uses submodules:false to keep the job lean, so
            # unmerged gitlinks have no checked-out commit and `git add`
            # would fail with "does not have a commit checked out". Write
            # the template's SHA (stage 3) straight into the index; if the
            # template removed the submodule, drop the entry instead.
            #
            # This only fires when both sides moved the same gitlink. It is
            # NOT a submodule-to-artifact migration: the template no longer
            # declares a scripts-general-util gitlink at all, so an
            # unrelated-histories merge never conflicts on it and leaves the
            # customer's gitlink in place. See "Detect dependency model".
            if [ -n "${SUBMODULE_CONFLICTS}" ]; then
              printf '%s\n' "${SUBMODULE_CONFLICTS}" | while IFS= read -r submod; do
                [ -z "${submod}" ] && continue
                THEIR_SHA=$(echo "$UNMERGED" \
                  | awk -v p="${submod}" \
                    '$1 == "160000" && $3 == 3 && $4 == p {print $2}' \
                  | head -n1)
                if [ -n "${THEIR_SHA}" ]; then
                  git update-index --cacheinfo "160000,${THEIR_SHA},${submod}"
                else
                  git rm --cached -- "${submod}" >/dev/null 2>&1 || true
                fi
              done
            fi

            if [ -n "${CONTENT_CONFLICTS}" ]; then
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
              {
                echo "conflicting_files<<DELIM"
                echo "${CONTENT_CONFLICTS}"
                echo "DELIM"
              } >> "$GITHUB_OUTPUT"
            else
              echo "conflicts=false" >> "$GITHUB_OUTPUT"
            fi

            if [ -n "${SUBMODULE_CONFLICTS}" ]; then
              {
                echo "submodule_conflicts<<DELIM"
                echo "${SUBMODULE_CONFLICTS}"
                echo "DELIM"
              } >> "$GITHUB_OUTPUT"
            fi

            git add -A

            # `git add -A` cannot resolve deletion conflicts; force-remove
            # any paths still flagged unmerged so the index is fully resolved.
            REMAINING=$(git ls-files --unmerged | awk '{print $4}' | sort -u)
            if [ -n "${REMAINING}" ]; then
              echo "::warning::Deletion conflicts resolved by removing: ${REMAINING//$'\n'/, }"
              printf '%s\n' "${REMAINING}" | while IFS= read -r path; do
                [ -z "${path}" ] && continue
                git rm -f -- "${path}" >/dev/null 2>&1 || true
              done
            fi
          fi

          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

      # Nothing below this line may be skipped on the way to a commit. The
      # merge above is staged but uncommitted, so failing here leaves the
      # remote untouched.
      - name: Guard - tree must be sane before committing
        if: steps.diff.outputs.up_to_date != 'true'
        env:
          SUBMODULE_ERA: ${{ steps.shape.outputs.submodule_era }}
        run: |
          set -euo pipefail
          if [ ! -x .github/scripts/check-tree-sanity.sh ]; then
            echo "::error::.github/scripts/check-tree-sanity.sh is missing or not executable."
            echo "Refusing to commit an unvalidated merge."
            exit 1
          fi
          if .github/scripts/check-tree-sanity.sh; then
            exit 0
          fi

          {
            echo "## Sync aborted: the merged tree is not safe to commit"
            echo
            echo "See the step log for the offending paths. **No commit was made"
            echo "and no pull request was opened.**"
            echo
            if [ "${SUBMODULE_ERA:-false}" = "true" ]; then
              echo "This repository is still on the **git-submodule** dependency"
              echo "model (\`scripts-general-util\` is a gitlink). The template"
              echo "moved to an Artifactory bundle dependency, so every shared"
              echo "file conflicts and the two models end up coexisting."
              echo
              echo "**It needs a migration, not a sync.**"
            else
              echo "Resolve the conflicts on a local checkout of"
              echo "\`${PR_BRANCH}\` and push, or fix the template."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "::error::Sync aborted: merged tree contains conflict markers or unparseable files."
          exit 1

      - name: Commit merge
        if: steps.diff.outputs.up_to_date != 'true'
        id: commit
        env:
          HAS_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null && git diff --cached --quiet; then
            echo "::notice::Merge produced no changes; nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_MSG="chore: sync with template (${MERGE_SHA:0:7})"
          if [ "${HAS_CONFLICTS}" = "true" ]; then
            COMMIT_MSG="${COMMIT_MSG} [auto-resolved]"
          fi
          git commit --no-edit -m "${COMMIT_MSG}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch and open PR
        if: steps.diff.outputs.up_to_date != 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          CONFLICTING_FILES: ${{ steps.merge.outputs.conflicting_files }}
          SUBMODULE_CONFLICTS: ${{ steps.merge.outputs.submodule_conflicts }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          .github/scripts/push-bot-branch.sh "${PR_BRANCH}"

          BODY=$(cat <<EOF
          Syncs this repository with the latest changes from the upstream template
          [\`${TEMPLATE_REPO}\`](https://github.com/${TEMPLATE_REPO}) at \`${MERGE_SHA:0:7}\`.

          The merged tree was checked before it was committed: no conflict markers,
          and every \`.envrc\`/\`.envrc.d\` shell file and workflow YAML parses.
          EOF
          )

          if [ "$HAS_CONFLICTS" = "true" ]; then
            CONFLICT_LIST=$(echo "$CONFLICTING_FILES" | sed 's/^/- `/' | sed 's/$/ `/')
            BODY=$(cat <<EOF
          ${BODY}

          > [!WARNING]
          > **These paths were unmerged and resolved automatically.** No conflict
          > markers remain — the job aborts rather than opening a PR when any do —
          > but git picked a side without understanding the content:
          >
          ${CONFLICT_LIST}
          >
          > Read the diff for these files before merging.
          EOF
            )
          fi

          if [ -n "${SUBMODULE_CONFLICTS:-}" ]; then
            SUBMODULE_LIST=$(echo "$SUBMODULE_CONFLICTS" | sed 's/^/- `/' | sed 's/$/ `/')
            BODY=$(cat <<EOF
          ${BODY}

          > [!NOTE]
          > **Submodule pointers set to the template's revision** (or dropped where
          > the template no longer declares them):
          >
          ${SUBMODULE_LIST}
          >
          > This is a pointer bump only — it does not convert a submodule to a
          > bundle dependency. Override locally to keep a different SHA.
          EOF
            )
          fi

          EXISTING_PR=$(gh pr list --head "${PR_BRANCH}" --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING_PR:-}" ]; then
            gh pr edit "$EXISTING_PR" --body "$BODY"
            echo "::notice::Updated existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --title "chore: sync with upstream template" \
              --body "$BODY" \
              --head "${PR_BRANCH}" \
              --label "dependencies,template-sync,automated-pr" || \
            gh pr create \
              --title "chore: sync with upstream template" \
              --body "$BODY" \
              --head "${PR_BRANCH}"
          fi
