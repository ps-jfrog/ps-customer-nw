name: Onboard Customer

# IssueOps entry point for creating a customer engagement repository.
#
# This file is copied into every derived repository by the template sync, so
# the guard below is the only thing standing between it and a repository whose
# audience includes the customer. It is a literal comparison, never
# vars.TEMPLATE_REPO: a customer repository that could name itself the template
# would re-enable repository creation from inside its own walls.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to process'
        required: true
        type: string
      command:
        description: 'What to do'
        required: true
        default: onboard
        type: choice
        options: [onboard, rollback]
      dry_run:
        description: 'Validate and report without writing anything'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: onboard-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  onboard:
    name: Onboard
    if: |
      github.repository == 'ps-jfrog/ps-customer-template' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && github.event.label.name == 'onboarding') ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         startsWith(github.event.comment.body, '/onboard'))
      )
    runs-on: ${{ vars.PREFERRED_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve command
        id: cmd
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "issue=${{ inputs.issue }}" >> "$GITHUB_OUTPUT"
              echo "command=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
              echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
              # `/onboard-rollback` also starts with `/onboard`, so match the
              # longer command first.
              if [[ "${COMMENT:-}" == /onboard-rollback* ]]; then
                echo "command=rollback" >> "$GITHUB_OUTPUT"
              else
                echo "command=onboard" >> "$GITHUB_OUTPUT"
              fi
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Minted here rather than in the target, which is the whole point: the
      # template holds the only App credential in the fleet.
      - uses: actions/create-github-app-token@v3
        id: app
        continue-on-error: true
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run
        env:
          # GITHUB_TOKEN, not the App token: reading the issue and writing the
          # sticky comment need `issues: write`, which the App does not have
          # and does not need — the issue lives in this repository.
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          ACTOR: ${{ github.actor }}
          DRY_RUN: ${{ steps.cmd.outputs.dry_run }}
        run: |
          .github/scripts/onboard-customer.sh \
            "${{ steps.cmd.outputs.issue }}" "${{ steps.cmd.outputs.command }}"
